# 에이전트 정책. 코드가 아니라 여기서 바꾼다. policy_version 은 응답과 감사 로그에 실린다.
policy_version: "2026-09-08.1"

retrieval:
  candidates: 10      # 4회차 확정값과 같다. 리랭커가 후보 수에 비례해 느려진다(10개 3.9초, 30개 12.6초, 10/7 실측)
  top_k: 8            # 리랭커 통과 후 답변에 넣는 근거 수
  max_retries: 2              # .env 의 MAX_RETRIES 가 있으면 그 값이 이긴다
  min_context_chars: 200

abstain:
  # 근거가 부족할 때 지어내지 않는다. 문구는 고객 대면에 그대로 나가므로 여기서 관리한다.
  no_evidence: "문서에서 근거를 찾지 못했습니다. 질문을 조금 더 구체적으로 알려주시거나 상담 창구로 문의해 주세요."
  insufficient: "관련 조항은 찾았지만 질문에 답하기에는 근거가 부족합니다. 확인된 내용만 안내드립니다."
  out_of_document: "이 값은 약관·설명서에 없고 산출방법서 등 비공개 문서에 있습니다. 해당 금융회사 확인이 필요합니다."
  missing_parameter: "문서의 해당 항목이 비어 있어({field}) 계산할 수 없습니다. 개별 계약서 또는 창구 확인이 필요합니다."
  missing_in_question: "질문에 값이 없어({field}) 계산하지 않았습니다. 금액과 기간을 알려주시면 계산해 드립니다."
  personal_data: "개인의 계좌·잔액 등 개인 금융정보는 이 시스템에서 다루지 않습니다."
  cannot_execute: "이 시스템은 조회·안내만 제공하며 거래를 실행할 수 없습니다."

escalation:
  # 사람에게 넘겨야 하는 상황. 자동 응답으로 끝내면 안 되는 것들이다.
  triggers: [민원, 분쟁, 소송, 손해배상, 해지환급금, 보험금 청구, 불완전판매]
  message: "정확한 안내를 위해 담당 상담사 연결이 필요한 내용입니다."

notices:
  ai_generated: "이 답변은 AI가 검색된 문서를 근거로 생성했습니다. 최종 확인은 원문과 상담 창구를 통해 주세요."
  expired_document: "근거 문서의 심의필 유효기간이 지났습니다({review_expiry}). 현행 조건은 다를 수 있습니다."
  synthetic: "이 근거는 교육용 열화 재현본에서 나왔습니다. 실제 문서가 아닙니다."
  law_constant: "세율·한도 등은 법령 상수이며 검색된 문서의 근거가 아닙니다."
  range_only: "공시된 범위만 확인할 수 있으며 개인에게 적용될 값은 확정할 수 없습니다."

pii:
  # 질의에 들어온 개인정보는 검색·로그에 남기기 전에 지운다.
  mask_before_retrieval: true
  patterns:
    resident_number: '\d{6}[-\s]?[1-4]\d{6}'
    card_number: '\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}'
    phone: '01[016-9][-\s]?\d{3,4}[-\s]?\d{4}'
    # 날짜(2026-01-15)는 계좌번호가 아니다. 세 묶음에 구분자가 있고 마지막 묶음이 3자리 이상인 것만 잡는다
    # (10/8 실측: 적금 입금일 '2026-01-15' 가 '[account_number]-15' 로 가려져 계산이 죽었다).
    account_number: '(?<!\d)(?!\d{4}[-\s]\d{2}[-\s]\d{2}(?!\d))\d{2,6}[-\s]\d{2,6}[-\s]\d{3,7}(?!\d)'
