# 계산 Tool 명세.
#
# LLM 은 이 파일을 보고 "어떤 파라미터를 문서에서 뽑아야 하는지"만 안다. 산식은
# src/finrag/tools/calc.py 의 순수 함수에 있고 모델은 손대지 않는다.
#
# required 가 하나라도 문서에 없으면 계산하지 않고 확인 요청으로 분기한다.
# 그것이 "빈칸 '( )%' 문서"에서 숫자를 지어내지 않는 유일한 방법이다.

savings_early_termination_rate:
  label: 적금·예금 중도해지이율
  function: calc.savings_early_termination_rate
  live_in_session: 5          # 5회차에 학생이 직접 구현
  forms:
    A: "기본이율 × (1 − 차감률) × 경과월수/계약월수  (신한 오락실적금)"
    B: "기준이율 × 구간 적용률 × 경과월수/계약월수  (농협, KB Star)"
    C: "기본금리 × 적용률 × 경과일수/계약일수      (카카오뱅크)"
  required: [base_rate_pct]
  one_of: [[ratio, deduction_pct, fixed_rate_pct]]
  from_document:
    ratio: "구간표의 적용률(50/60/70/80/90%)"
    deduction_pct: "차감률(신한 80%)"
    fixed_rate_pct: "구간표 첫 행이 산식이 아니라 고정값인 경우(농협 3개월 미만 0.1%)"
    min_rate_pct: "최저보장이율(0.1%, 0.2%, 0.30%)"
    rate_precision: "이율 절사 자리수(농협 소수 셋째자리)"
    month_rule: "월 미만 처리(농협 버림 / KB Star 절상)"
  pitfalls:
    - "구간표 첫 행은 산식이 아니라 고정값인 경우가 많다. 산식을 억지로 적용하면 틀린다."
    - "월수 규칙이 은행마다 반대다(버림 vs 절상)."
    - "산출값이 최저보장보다 작으면 최저보장이 답이다."

savings_maturity_interest:
  label: 적금 만기이자(입금 건별 일할)
  function: calc.savings_maturity_interest
  required: [amount, rate_pct, deposit_dates, maturity]
  from_document:
    day_count: "365 또는 366"
    per_deposit_truncate: "'합계 후 절사'인지 '건별 절사 후 합계'인지"
  pitfalls:
    - "총액 절사와 건별 절사가 다르다(97,890 vs 97,884). 문서가 명시하지 않으면 둘 다 제시한다."
    - "세율은 법령 상수이며 문서 근거가 아니다. 답변에 그 사실을 적는다."

deposit_interest:
  label: 예금 이자(단리·월복리)
  function: calc.deposit_interest
  required: [principal, rate_pct, months]
  from_document:
    mode: "단리식/복리식 — 문서에 산식이 적혀 있다"

prepayment_fee:
  label: 대출 중도상환수수료(중도상환해약금)
  function: calc.prepayment_fee
  live_in_session: 5          # 과제. 완성본은 제공
  formula: "중도상환금액 × 요율 × (대출잔여일수 ÷ 대출기간)"
  required: [amount, fee_rate_pct]
  from_document:
    fee_rate_pct: "요율. '( )%' 로 비어 있으면 계산 불가 → 확인 요청"
    days_remaining: "대출잔여일수. 질문의 '3년 만기 중 2년 뒤'면 365"
    days_total: "대출기간(3년 간주면 1095, 윤년 1096)"
    waiver_months: "면제 기준(하나 3개월, iM 1개월, 삼성화재 3개월)"
    exempt_amount: "면제옵션(50% 면제형, 매년 10% 갱신형)"
  pitfalls:
    - "면제 판정을 산식보다 먼저 한다. 0원이어야 할 답에 숫자가 나온다."
    - "윤년이면 365/1095 가 366/1096 이 된다(466,666 → 467,518)."
    - "2025.1 실비용 원칙 개편 이후 요율이 바뀌었다. 문서의 basis_date 를 함께 본다."

delinquency_interest:
  label: 연체이자
  function: calc.delinquency_interest
  required: [principal, contract_rate_pct, penalty_add_pct]
  from_document:
    cap_rate_pct: "연체이자율 상한. iM 설명서는 공란이다 → 상한을 물으면 확인 요청"
  pitfalls:
    - "우리은행 1,003,333원 예시는 납부총액(약정이자 100만 + 지연배상금 3,333)이지 연체이자가 아니다."

delinquency_rate:
  label: 연체이자율(카드)
  function: calc.delinquency_rate
  required: [normal_rate_pct]
  constants: [delinquency.add_on_rate, interest_caps.legal_max_rate]
  pitfalls:
    - "법정최고 20% 캡이 걸리면 그 사실을 답변에 남긴다(18% + 3%p = 21% → 20%)."
    - "KB 공시표에 20% 를 넘는 값이 남아 있다. 규칙 문구가 우선이며 상충을 언급한다."

card_overseas_charge:
  label: 해외이용 원화청구금액
  function: calc.card_overseas_charge
  required: [usd, tt_rate, brand_fee_pct, service_fee_pct]
  from_document:
    brand_fee_pct: "브랜드별로 다르다(아멕스 1.4, 비자 1.0~1.1, 마스터 1.0)"

silson_outpatient_payout:
  label: 실손 급여 통원 보험금
  function: calc.silson_outpatient_payout
  required: [copay, fixed_deductible]
  from_document:
    health_copay_rate: "5세대에만 있는 항목. 영수증의 건강보험 본인부담률"
  pitfalls:
    - "세대가 답을 바꾼다. 4세대는 공제 후보 2개, 5세대는 3개다(상급종합 60,000 → 32,000)."
    - "질문에 세대·시행일이 없으면 되묻는다."

silson_noncovered_payout:
  label: 실손 비급여 보험금
  function: calc.silson_noncovered_payout
  required: [amount, kind]
  pitfalls:
    - "5세대는 중증(특약1)과 비중증(특약2)의 공제·보상률이 다르다."

cancer_benefit:
  label: 암 진단급여금
  function: calc.cancer_benefit
  required: [sum_insured, months_since_start]
  pitfalls:
    - "보장개시(90일) 판정을 감액 판정보다 먼저 한다."
    - "유방암 등은 납입면제 대상이 아니다(제7조 단서)."

# 계산하면 안 되는 것
not_calculable:
  해지환급금:
    reason: "산출방법서 영역. 약관에는 예시표만 있다."
    correct_answer: "약관 제34조를 인용하고 경과기간별 환급금 표 확인을 안내한다."
  보험료:
    reason: "산출방법서 영역"
    correct_answer: "예시표 인용 + 보험사 확인 안내"
  개인별_리볼빙_카드론_이자율:
    reason: "신용점수별 범위만 공시된다"
    correct_answer: "범위 제시 + 개인 확정 불가 명시"
